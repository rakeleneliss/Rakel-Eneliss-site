<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Портфолио & Конструктор</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1a1a1a; color: #fff; line-height: 1.6; overflow-x: hidden; }
        .parallax-bg {
            background-image: url('https://picsum.photos');
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 10%;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; }
        .header-text h1 { font-size: 24px; font-weight: 600; }
        .header-text p { font-size: 14px; color: #ccc; }
        .social-icons { display: flex; gap: 15px; }
        .social-icon {
            width: 40px; height: 40px; background: rgba(255,255,255,0.1);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: #fff; text-decoration: none; font-weight: bold; transition: 0.3s;
        }
        .social-icon:hover { background: #fff; color: #1a1a1a; transform: translateY(-3px); }
        .block { padding: 60px 10%; }
        .block-title {
            padding: 20px; text-align: center; font-size: 28px; letter-spacing: 2px;
            text-transform: uppercase; border-radius: 8px; margin-bottom: 30px;
            box-shadow: inset 0 0 0 2000px rgba(0, 0, 0, 0.4);
        }
        .carousel-container {
            max-width: 600px; margin: 0 auto; position: relative;
            border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .carousel-slides { display: flex; transition: transform 0.5s ease-in-out; }
        .carousel-slide { min-width: 100%; height: 400px; object-fit: cover; cursor: pointer; }
        .constructor-section { background: #222; padding: 60px 10%; text-align: center; }
        .constructor-card {
            background: #2b2b2b; max-width: 500px; margin: 0 auto; border-radius: 16px;
            overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.6); padding: 25px;
        }
        .preview-box { width: 100%; height: 250px; background: #3a3a3a; border-radius: 8px; margin-bottom: 20px; overflow: hidden; }
        .preview-box img { width: 100%; height: 100%; object-fit: cover; }
        .option-group { margin-bottom: 20px; text-align: left; }
        .option-label { font-size: 14px; color: #aaa; margin-bottom: 8px; text-transform: uppercase; display: block;}
        .buttons-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .btn-opt {
            background: #3a3a3a; border: 2px solid transparent; color: #fff; padding: 10px 5px;
            border-radius: 8px; cursor: pointer; font-size: 13px; transition: 0.2s; font-weight: 500;
        }
        .btn-opt:hover { background: #4a4a4a; }
        .btn-opt.active { background: #007bff !important; border-color: #00d2ff !important; }
        .price-display { font-size: 28px; font-weight: bold; margin-top: 25px; color: #00d2ff; border-top: 1px solid #444; padding-top: 15px; }
        .lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9);
            display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease; z-index: 1000;
        }
        .lightbox.active { opacity: 1; pointer-events: auto; }
        .lightbox-img { max-width: 90%; max-height: 90%; border-radius: 4px; transform: scale(0.95); transition: transform 0.4s ease; }
        .lightbox.active .lightbox-img { transform: scale(1); }
    </style>
</head>

<script>
    (function() {
        // Ваши фиксированные тарифы
        var priceMatrix = {
            sketch: { head: 450, half: 900, full: 1200 },
            simple: { head: 800, half: 2000, full: 2800 },
            hard: { head: 1300, half: 2800, full: 4200 }
        };

        // Списки опций для циклического переключения
        var optionsConfig = {
            chars: [
                { val: "1", text: "1 Персонаж" },
                { val: "2", text: "2 Персонажа (x2)" },
                { val: "3", text: "3+ Персонажа (x3)" }
            ],
            render: [
                { val: "sketch", text: "Чб/Моно скетч" },
                { val: "simple", text: "Простой рендер" },
                { val: "hard", text: "Сложный рендер" }
            ],
            format: [
                { val: "head", text: "Хед" },
                { val: "half", text: "Халф" },
                { val: "full", text: "Фулл" }
            ],
            bg: [
                { val: "none", text: "Без фона" },
                { val: "light", text: "Лёгкий фон (+500)" },
                { val: "hard", text: "Сложный фон" }
            ]
        };

        // Текущие индексы выбранных элементов в списках
        var currentIndices = { chars: 0, render: 0, format: 0, bg: 0 };
        var savedOrders = [];

        // Вспомогательная функция для получения текущего состояния объекта параметров
        function getActiveItemState() {
            return {
                chars: optionsConfig.chars[currentIndices.chars].val,
                render: optionsConfig.render[currentIndices.render].val,
                format: optionsConfig.format[currentIndices.format].val,
                bg: optionsConfig.bg[currentIndices.bg].val,
                charsText: optionsConfig.chars[currentIndices.chars].text.split(" (")[0],
                renderText: optionsConfig.render[currentIndices.render].text,
                formatText: optionsConfig.format[currentIndices.format].text,
                bgText: optionsConfig.bg[currentIndices.bg].text.split(" (+")[0]
            };
        }

        // Подсчет стоимости одной строчки
        function calculateSinglePrice(item) {
            var base = priceMatrix[item.render][item.format];
            var mult = (item.chars === "2") ? 2 : (item.chars === "3" ? 3 : 1);
            var sub = base * mult;

            var minBg = 0, maxBg = 0;
            if (item.bg === "light") { minBg = 500; maxBg = 500; }
            else if (item.bg === "hard") { minBg = 1000; maxBg = 3000; }

            return {
                min: sub + minBg,
                max: sub + maxBg,
                isRange: item.bg === "hard",
                isPlus: item.chars === "3"
            };
        }

        // Обновление всей корзины и итоговой суммы
        function updateCartSummary() {
            var listDiv = document.getElementById("js-smart-items-list");
            var containerDiv = document.getElementById("js-smart-list-container");
            var totalSpan = document.getElementById("js-smart-total-price");

            if (!listDiv || !containerDiv || !totalSpan) return;

            if (savedOrders.length === 0) {
                containerDiv.style.display = "none";
                totalSpan.innerText = "0";
                return;
            }

            containerDiv.style.display = "block";
            listDiv.innerHTML = "";

            var totalMin = 0, totalMax = 0;
            var hasRange = false, hasPlus = false;

            savedOrders.forEach(function(item, idx) {
                var p = calculateSinglePrice(item);
                totalMin += p.min;
                totalMax += p.max;
                if (p.isRange) hasRange = true;
                if (p.isPlus) hasPlus = true;

                var pText = p.isRange ? (p.min + "-" + p.max) : p.min;
                if (p.isPlus) pText += "+";

                var row = document.createElement("div");
                row.style.cssText = "display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 12px 16px; border-radius: 10px; margin-bottom: 8px; font-size: 13px; line-height: 1.4; border: 1px solid rgba(136,67,168,0.08);";

                var textSpan = document.createElement("span");
                textSpan.style.maxWidth = "75%";
                textSpan.style.color = "#444";
                textSpan.innerText = item.charsText + ", " + item.renderText + ", " + item.formatText + ", " + item.bgText;

                var rightBox = document.createElement("div");
                rightBox.style.cssText = "display: flex; align-items: center; gap: 12px;";

                var priceSpan = document.createElement("span");
                priceSpan.style.cssText = "color: #8843a8; font-weight: bold;";
                priceSpan.innerText = pText + " р.";

                var delBtn = document.createElement("button");
                delBtn.type = "button";
                delBtn.innerHTML = "&times;";
                delBtn.style.cssText = "background: none; border: none; color: #ff4a4a; font-size: 20px; cursor: pointer; padding: 0; font-weight: bold; outline: none; line-height: 1;";
                delBtn.addEventListener("click", function() {
                    savedOrders.splice(idx, 1);
                    updateCartSummary();
                });
