<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портфолио & Конструктор</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1a1a1a; color: #fff; line-height: 1.6; overflow-x: hidden; }
        .parallax-bg {
            background-image: url('https://picsum.photos');
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 10%;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; }
        .header-text h1 { font-size: 24px; font-weight: 600; }
        .header-text p { font-size: 14px; color: #ccc; }
        .social-icons { display: flex; gap: 15px; }
        .social-icon {
            width: 40px; height: 40px; background: rgba(255,255,255,0.1);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: #fff; text-decoration: none; font-weight: bold; transition: 0.3s;
        }
        .social-icon:hover { background: #fff; color: #1a1a1a; transform: translateY(-3px); }
        .block { padding: 60px 10%; }
        .block-title {
            padding: 20px; text-align: center; font-size: 28px; letter-spacing: 2px;
            text-transform: uppercase; border-radius: 8px; margin-bottom: 30px;
            box-shadow: inset 0 0 0 2000px rgba(0, 0, 0, 0.4);
        }
        .carousel-container {
            max-width: 600px; margin: 0 auto; position: relative;
            border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .carousel-slides { display: flex; transition: transform 0.5s ease-in-out; }
        .carousel-slide { min-width: 100%; height: 400px; object-fit: cover; cursor: pointer; }
        .constructor-section { background: #222; padding: 60px 10%; text-align: center; }
        .constructor-card {
            background: #2b2b2b; max-width: 500px; margin: 0 auto; border-radius: 16px;
            overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.6); padding: 25px;
        }
        .preview-box { width: 100%; height: 250px; background: #3a3a3a; border-radius: 8px; margin-bottom: 20px; overflow: hidden; }
        .preview-box img { width: 100%; height: 100%; object-fit: cover; }
        .option-group { margin-bottom: 20px; text-align: left; }
        .option-label { font-size: 14px; color: #aaa; margin-bottom: 8px; text-transform: uppercase; display: block;}
        .buttons-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .btn-opt {
            background: #3a3a3a; border: 2px solid transparent; color: #fff; padding: 10px 5px;
            border-radius: 8px; cursor: pointer; font-size: 13px; transition: 0.2s; font-weight: 500;
        }
        .btn-opt:hover { background: #4a4a4a; }
        .btn-opt.active { background: #007bff !important; border-color: #00d2ff !important; }
        .price-display { font-size: 28px; font-weight: bold; margin-top: 25px; color: #00d2ff; border-top: 1px solid #444; padding-top: 15px; }
        .lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9);
            display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease; z-index: 1000;
        }
        .lightbox.active { opacity: 1; pointer-events: auto; }
        .lightbox-img { max-width: 90%; max-height: 90%; border-radius: 4px; transform: scale(0.95); transition: transform 0.4s ease; }
        .lightbox.active .lightbox-img { transform: scale(1); }
    </style>
</head>

    </div>

    <button type="button" id="submit-order-btn" style="display: block; width: 100%; background: #28a745; border: none; color: #fff; padding: 15px; margin-top: 20px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; text-align: center; box-shadow: 0 4px 15px rgba(40,167,69,0.3);">
        Оформить заказ через Google Форму
    </button>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        var priceMatrix = {
            sketch: { head: 450, half: 900, full: 1200 },
            simple: { head: 800, half: 2000, full: 2800 },
            hard: { head: 1300, half: 2800, full: 4200 }
        };

        var textLabels = {
            chars: { "1": "1 персонаж", "2": "2 персонажа", "3": "3+ персонажа" },
            render: { "sketch": "Чб/Моно скетч", "simple": "Простой рендер", "hard": "Сложный рендер" },
            format: { "head": "Хед", "half": "Халф", "full": "Фулл" },
            bg: { "none": "Без фона", "light": "Лёгкий фон", "hard": "Сложный фон" }
        };

        var current = { chars: "1", render: "sketch", format: "head", bg: "none" };
        var buttons = document.getElementsByClassName("calc-btn");

        function getPriceString() {
            var basePrice = priceMatrix[current.render][current.format];
            var charMultiplier = (current.chars === "2") ? 2 : (current.chars === "3" ? 3 : 1);
            var subtotal = basePrice * charMultiplier;

            var minBg = 0, maxBg = 0;
            if (current.bg === "light") { minBg = 500; maxBg = 500; }
            else if (current.bg === "hard") { minBg = 1000; maxBg = 3000; }

            var finalMin = subtotal + minBg;
            var finalMax = subtotal + maxBg;

            var str = "";
            if (current.bg === "hard") {
                str = finalMin + " - " + finalMax;
            } else {
                str = finalMin;
            }

            if (current.chars === "3") {
                str += "+";
            }
            return str;
        }

        function calculatePrice() {
            var priceDisplay = document.getElementById("calc-price-num");
            if (priceDisplay) {
                priceDisplay.innerText = getPriceString();
            }
        }

        for (var i = 0; i < buttons.length; i++) {
            buttons[i].addEventListener("click", function(event) {
                event.preventDefault();
                var groupName = this.getAttribute("data-group");
                var valueName = this.getAttribute("data-val");

                for (var j = 0; j < buttons.length; j++) {
                    if (buttons[j].getAttribute("data-group") === groupName) {
                        buttons[j].style.backgroundColor = "#3a3a3a";
                        buttons[j].style.borderColor = "transparent";
                    }
                }

                this.style.backgroundColor = "#007bff";
                this.style.borderColor = "#00d2ff";
                current[groupName] = valueName;

                calculatePrice();
            });
        }

        var orderBtn = document.getElementById("submit-order-btn");
        if (orderBtn) {
            orderBtn.addEventListener("click", function() {
                var currentPrice = getPriceString();
                var orderDetails = "Заказ: " + textLabels.chars[current.chars] + ", " + 
                                   textLabels.render[current.render] + ", " + 
                                   textLabels.format[current.format] + ", " + 
                                   textLabels.bg[current.bg] + ". Примерная цена: " + currentPrice + " руб.";

                var tempTextArea = document.createElement("textarea");
                tempTextArea.value = orderDetails;
                document.body.appendChild(tempTextArea);
                tempTextArea.select();
                document.execCommand("copy");
                document.body.removeChild(tempTextArea);

                alert("Параметры расчета скопированы в буфер обмена!\n\nВставьте их в соответствующее поле Google Формы.");
                window.open("https://google.com", "_blank");
            });
        }

        calculatePrice();
    });
</script>
