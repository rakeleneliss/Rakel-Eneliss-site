<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портфолио & Конструктор</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1a1a1a; color: #fff; line-height: 1.6; overflow-x: hidden; }
        .parallax-bg {
            background-image: url('https://picsum.photos');
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 10%;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; }
        .header-text h1 { font-size: 24px; font-weight: 600; }
        .header-text p { font-size: 14px; color: #ccc; }
        .social-icons { display: flex; gap: 15px; }
        .social-icon {
            width: 40px; height: 40px; background: rgba(255,255,255,0.1);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: #fff; text-decoration: none; font-weight: bold; transition: 0.3s;
        }
        .social-icon:hover { background: #fff; color: #1a1a1a; transform: translateY(-3px); }
        .block { padding: 60px 10%; }
        .block-title {
            padding: 20px; text-align: center; font-size: 28px; letter-spacing: 2px;
            text-transform: uppercase; border-radius: 8px; margin-bottom: 30px;
            box-shadow: inset 0 0 0 2000px rgba(0, 0, 0, 0.4);
        }
        .carousel-container {
            max-width: 600px; margin: 0 auto; position: relative;
            border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .carousel-slides { display: flex; transition: transform 0.5s ease-in-out; }
        .carousel-slide { min-width: 100%; height: 400px; object-fit: cover; cursor: pointer; }
        .constructor-section { background: #222; padding: 60px 10%; text-align: center; }
        .constructor-card {
            background: #2b2b2b; max-width: 500px; margin: 0 auto; border-radius: 16px;
            overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.6); padding: 25px;
        }
        .preview-box { width: 100%; height: 250px; background: #3a3a3a; border-radius: 8px; margin-bottom: 20px; overflow: hidden; }
        .preview-box img { width: 100%; height: 100%; object-fit: cover; }
        .option-group { margin-bottom: 20px; text-align: left; }
        .option-label { font-size: 14px; color: #aaa; margin-bottom: 8px; text-transform: uppercase; display: block;}
        .buttons-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .btn-opt {
            background: #3a3a3a; border: 2px solid transparent; color: #fff; padding: 10px 5px;
            border-radius: 8px; cursor: pointer; font-size: 13px; transition: 0.2s; font-weight: 500;
        }
        .btn-opt:hover { background: #4a4a4a; }
        .btn-opt.active { background: #007bff !important; border-color: #00d2ff !important; }
        .price-display { font-size: 28px; font-weight: bold; margin-top: 25px; color: #00d2ff; border-top: 1px solid #444; padding-top: 15px; }
        .lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9);
            display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease; z-index: 1000;
        }
        .lightbox.active { opacity: 1; pointer-events: auto; }
        .lightbox-img { max-width: 90%; max-height: 90%; border-radius: 4px; transform: scale(0.95); transition: transform 0.4s ease; }
        .lightbox.active .lightbox-img { transform: scale(1); }
    </style>
</head>
<body class="parallax-bg">

            <div class="header-text">

        </div>
        <div class="social-icons">

    <section class="block">

                </div>
            </div>

    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" class="lightbox-img" src="" alt="Увеличенное изображение">
    </div>

    <script>
        document.querySelectorAll('.carousel-container').forEach(carousel => {
            const slidesContainer = carousel.querySelector('.carousel-slides');
            const slides = carousel.querySelectorAll('.carousel-slide');
            const speed = parseInt(carousel.getAttribute('data-speed')) || 3000;
            let currentIndex = 0;
            setInterval(() => {
                currentIndex = (currentIndex + 1) % slides.length;
                slidesContainer.style.transform = `translateX(-${currentIndex * 100}%)`;
            }, speed);
        });

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        function openLightbox(src) {
            lightboxImg.src = src;
            lightbox.classList.add('active');
        }
        function closeLightbox() {
            lightbox.classList.remove('active');
        }
        <div id="art-calc-widget" style="background: #2b2b2b; color: #fff; max-width: 500px; margin: 20px auto; border-radius: 16px; padding: 25px; font-family: system-ui, -apple-system, sans-serif; box-sizing: border-box;">
    
    <div style="width: 100%; height: 250px; background: #3a3a3a; border-radius: 8px; margin-bottom: 20px; overflow: hidden; box-sizing: border-box;">
        <img id="calc-preview" src="https://picsum.photos" alt="Превью" style="width: 100%; height: 100%; object-fit: cover; display: block;">
    </div>

    <!-- Группа 1: Персонажи -->
    <div class="calc-group" style="margin-bottom: 20px;">
        <span style="font-size: 14px; color: #aaa; margin-bottom: 8px; text-transform: uppercase; display: block; font-weight: bold;">Персонажи</span>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;">
            <button type="button" class="calc-btn active-state" data-group="chars" data-val="1" style="background: #007bff; border: 2px solid #00d2ff; color: #fff; padding: 12px 5px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; outline: none; transition: background 0.2s;">1 Персонаж</button>
            <button type="button" class="calc-btn" data-group="chars" data-val="2" style="background: #3a3a3a; border: 2px solid transparent; color: #fff; padding: 12px 5px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; outline: none; transition: background 0.2s;">2 Персонажа (x2)</button>
            <button type="button" class="calc-btn" data-group="chars" data-val="3" style="background: #3a3a3a; border: 2px solid transparent; color: #fff; padding: 12px 5px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; outline: none; transition: background 0.2s;">3+ Персонажа (x3)</button>
        </div>
    </div>

    <!-- Группа 2: Рендер -->
    <div class="calc-group" style="margin-bottom: 20px;">
        <span style="font-size: 14px; color: #aaa; margin-bottom: 8px; text-transform: uppercase; display: block; font-weight: bold;">Рендер</span>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;">
            <button type="button" class="calc-btn active-state" data-group="render" data-val="sketch" style="background: #007bff; border: 2px solid #00d2ff; color: #fff; padding: 12px 5px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; outline: none; transition: background 0.2s;">Чб/Моно скетч</button>
            <button type="button" class="calc-btn" data-group="render" data-val="simple" style="background: #3a3a3a; border: 2px solid transparent; color: #fff; padding: 12px 5px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; outline: none; transition: background 0.2s;">Простой рендер</button>
            <button type="button" class="calc-btn" data-group="render" data-val="hard" style="background: #3a3a3a; border: 2px solid transparent; color: #fff; padding: 12px 5px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; outline: none; transition: background 0.2s;">Сложный рендер</button>
        </div>
    </div>

    <!-- Группа 3: Формат -->
    <div class="calc-group" style="margin-bottom: 20px;">
        <span style="font-size: 14px; color: #aaa; margin-bottom: 8px; text-transform: uppercase; display: block; font-weight: bold;">Формат</span>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;">
            <button type="button" class="calc-btn active-state" data-group="format" data-val="head" style="background: #007bff; border: 2px solid #00d2ff; color: #fff; padding: 12px 5px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; outline: none; transition: background 0.2s;">Хед</button>

            <button type="button" class="calc-btn" data-group="bg" data-val="light" style="background: #3a3a3a; border: 2px solid transparent; color: #fff; padding: 12px 5px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; outline: none; transition: background 0.2s;">Лёгкий (+500)</button>
            <button type="button" class="calc-btn" data-group="bg" data-val="hard" style="background: #3a3a3a; border: 2px solid transparent; color: #fff; padding: 12px 5px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; outline: none; transition: background 0.2s;">Сложный</button>
        </div>
    </div>

    <div style="font-size: 26px; font-weight: bold; margin-top: 25px; color: #00d2ff; border-top: 1px solid #444; padding-top: 15px; text-align: center;">
        Итого: <span id="calc-price-num">450</span> руб.
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Табличная сетка цен с вашей картинки
        var priceMatrix = {
            sketch: { head: 450, half: 900, full: 1200 },
            simple: { head: 800, half: 2000, full: 2800 },
            hard: { head: 1300, half: 2800, full: 4200 }
        };

        var current = { chars: "1", render: "sketch", format: "head", bg: "none" };
        var buttons = document.getElementsByClassName("calc-btn");

        for (var i = 0; i < buttons.length; i++) {
            buttons[i].addEventListener("click", function(event) {
                event.preventDefault();
                
                var clickedBtn = this;
                var groupName = clickedBtn.getAttribute("data-group");
                var valueName = clickedBtn.getAttribute("data-val");

                // Переключение активного состояния кнопок в группе
                for (var j = 0; j < buttons.length; j++) {
                    if (buttons[j].getAttribute("data-group") === groupName) {
                        buttons[j].classList.remove("active-state");
                        buttons[j].style.backgroundColor = "#3a3a3a";
                        buttons[j].style.borderColor = "transparent";
                    }
                }

                clickedBtn.classList.add("active-state");
                clickedBtn.style.backgroundColor = "#007bff";
                clickedBtn.style.borderColor = "#00d2ff";

                current[groupName] = valueName;

                // Обновление картинки-заглушки
                var img = document.getElementById("calc-preview");
                if (img) {
                    img.src = "https://picsum.photos" + Math.floor(Math.random() * 1000);
                }

                // --- ЛОГИКА РАСЧЕТА СТОИМОСТИ ---
                
                // 1. Берем базовую стоимость из таблицы по рендеру и формату
                var basePrice = priceMatrix[current.render][current.format];

                // 2. Считаем множитель персонажей
                var charMultiplier = 1;
                if (current.chars === "2") charMultiplier = 2;
                if (current.chars === "3") charMultiplier = 3;

  

                var subtotal = basePrice * charMultiplier;

                // 3. Рассчитываем доплаты за фон (минимальную и максимальную вилку)
                var minBg = 0;
                var maxBg = 0;

                if (current.bg === "light") {
                    minBg = 500;
                    maxBg = 500;
                } else if (current.bg === "hard") {
                    minBg = 1000;
                    maxBg = 3000;
                }

                var finalMin = subtotal + minBg;
                var finalMax = subtotal + maxBg;

                // 4. Формируем красивый текстовый вывод цены
                var resultText = "";
                
                if (current.bg === "hard") {
                    // Если фон сложный, выводим диапазон цен
                    resultText = finalMin + " - " + finalMax;
                } else {
                    // Если фон обычный, число фиксированное
                    resultText = finalMin;
                }

                // Если персонажей 3+, добавляем плюс к итоговой строке
                if (current.chars === "3") {
                    resultText += "+";
                }

                // Выводим в интерфейс
                var priceDisplay = document.getElementById("calc-price-num");
                if (priceDisplay) {
                    priceDisplay.innerText = resultText;
                }
            });
        }
    });
</script>
