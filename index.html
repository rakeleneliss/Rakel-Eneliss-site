            <div class="action-buttons">

<!-- Блок скидок -->
<div class="section discount-section" style="margin-top: 15px; padding-top: 10px; border-top: 1px dashed rgba(255,255,255,0.2);">
    <div class="section-title" style="font-weight: bold; margin-bottom: 10px; color: #fff;">Скидка:</div>
    <div class="options-grid" id="discount-group" style="display: flex; gap: 15px; flex-wrap: wrap;">
        <label class="option-label" style="color: #fff; cursor: pointer;"><input type="radio" name="discount-option" value="10"> Заказ с сайта (10%)</label>
        <label class="option-label" style="color: #fff; cursor: pointer;"><input type="radio" name="discount-option" value="20"> За отзыв (20%)</label>
        <label class="option-label" style="color: #fff; cursor: pointer;"><input type="radio" name="discount-option" value="30"> За подписку (30%)</label>
    </div>
</div>

   Общая сумма: <span id="grand-total">0</span> руб.
            </div>
        </div>
    </section>

    <script>
        const priceList = {
            sketch: { head: 450, half: 900, full: 1200 },
            simple: { head: 800, half: 2000, full: 2800 },
            hard:   { head: 1300, half: 2800, full: 4200 }
        };

        const calculatorList = document.getElementById('calculator-list');
        const grandTotalSpan = document.getElementById('grand-total');
        let blockCounter = 0;

        function createNewBlock() {
            blockCounter++;
            const blockId = blockCounter;
            
            const block = document.createElement('div');
            block.className = 'calculator-block';
            block.innerHTML = `
                <button class="remove-btn" title="Удалить этот заказ" onclick="removeBlock(event)">&times;</button>
                
                <div class="section">
                    <div class="section-title">Персонажи</div>
                    <div class="options-grid">
                        <label class="option-label"><input type="radio" name="chars-${blockId}" value="1" checked> 1</label>
                        <label class="option-label"><input type="radio" name="chars-${blockId}" value="2"> 2 (x2 к цене)</label>
                        <label class="option-label"><input type="radio" name="chars-${blockId}" value="custom"> Свой вариант</label>
                    </div>
                    <div class="custom-count-wrapper">
                        <input type="number" class="custom-count-input" value="3" min="1" placeholder="Введите количество персонажей">
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">Формат</div>
                    <div class="options-grid">
                        <label class="option-label"><input type="radio" name="format-${blockId}" value="head" checked> Хед</label>
                        <label class="option-label"><input type="radio" name="format-${blockId}" value="half"> Халф</label>
                        <label class="option-label"><input type="radio" name="format-${blockId}" value="full"> Полнорост</label>
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">Рендер</div>
                    <div class="options-grid">
                        <label class="option-label"><input type="radio" name="render-${blockId}" value="sketch" checked> Скетч/МОНО цвет</label>
                        <label class="option-label"><input type="radio" name="render-${blockId}" value="simple"> Простой рендер</label>
                        <label class="option-label"><input type="radio" name="render-${blockId}" value="hard"> Сложный рендер</label>
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">Фон</div>
                    <div class="options-grid">
                        <label class="option-label"><input type="radio" name="background-${blockId}" value="abstract" checked> Абстрактный (бесплатно)</label>
                        <label class="option-label"><input type="radio" name="background-${blockId}" value="simple"> Простой (+500р.)</label>
                        <label class="option-label"><input type="radio" name="background-${blockId}" value="hard"> Сложный (+1500-4500р.)</label>
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">Другие опции</div>
                    <div class="options-grid">
                        <label class="option-label"><input type="checkbox" name="chibi-${blockId}" value="chibi"> Чиби (цена / 2)</label>
                        <label class="option-label"><input type="checkbox" name="design-${blockId}" value="design"> Оформление (+200)</label>
                    </div>
                </div>

                <div class="block-total">
                    Стоимость: <span class="block-price">0</span> руб.
                </div>
            `;

            block.addEventListener('change', () => calculateBlock(block, blockId));
            
            const charsRadios = block.querySelectorAll(`input[name="chars-${blockId}"]`);
            const customWrapper = block.querySelector('.custom-count-wrapper');
            charsRadios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    customWrapper.style.display = (e.target.value === 'custom') ? 'block' : 'none';
                    calculateBlock(block, blockId);
                });
            });

            calculatorList.appendChild(block);
            calculateBlock(block, blockId);
        }

        function removeBlock(event) {
            event.preventDefault();
            event.currentTarget.closest('.calculator-block').remove();
            updateGrandTotal();
        }

        function calculateBlock(block, blockId) {
            const renderType = block.querySelector(`input[name="render-${blockId}"]:checked`).value;
            const format = block.querySelector(`input[name="format-${blockId}"]:checked`).value;
            const chars = block.querySelector(`input[name="chars-${blockId}"]:checked`).value;
            const background = block.querySelector(`input[name="background-${blockId}"]:checked`).value;
            const chibi = block.querySelector(`input[name="chibi-${blockId}"]`).checked;
            const design = block.querySelector(`input[name="design-${blockId}"]`).checked;

            let basePrice = priceList[renderType][format];

            if (chars === '2') {
                basePrice *= 2;
            } else if (chars === 'custom') {
                const customCount = block.querySelector('.custom-count-input').value || 1;
                basePrice *= parseInt(customCount);
            }

            let priceWithoutBg = basePrice;
            if (chibi) {
                priceWithoutBg /= 2;
            }

            if (design) {
                priceWithoutBg += 200;
            }

            let bgPrice = 0;
            let priceDisplay = '';
            
            if (background === 'simple') {
                bgPrice = 500;
                priceDisplay = (priceWithoutBg + bgPrice);
            } else if (background === 'hard') {
                bgPrice = 1500;
                const minPrice = priceWithoutBg + 1500;
                const maxPrice = priceWithoutBg + 4500;
                priceDisplay = minPrice + '-' + maxPrice;
            } else {
                priceDisplay = priceWithoutBg;
            }

            block.querySelector('.block-price').textContent = priceDisplay;
            updateGrandTotal();
        }

        function updateGrandTotal() {
            let minTotal = 0;
            let maxTotal = 0;
            let hasRange = false;
            
            document.querySelectorAll('.block-price').forEach(el => {
                const text = el.textContent;
                // Если это диапазон (содержит "-"), берём минимальное и максимальное значение
                if (text.includes('-')) {
                    const parts = text.split('-');
                    const min = parseInt(parts[0]);
                    const max = parseInt(parts[1]);
                    minTotal += min || 0;
                    maxTotal += max || 0;
                    hasRange = true;
                } else {
                    const price = parseInt(text) || 0;
                    minTotal += price;
                    maxTotal += price;
                }
            });

            // Применяем скидку
            const selectedRadio = document.querySelector('input[name="discount-option"]:checked');
            const discountValue = selectedRadio ? parseInt(selectedRadio.value) : 0;

            if (discountValue > 0) {
                minTotal = Math.round(minTotal * (1 - discountValue / 100));
                maxTotal = Math.round(maxTotal * (1 - discountValue / 100));
            }
            
            // Отображаем диапазон, если есть хотя бы один, иначе просто число
            let resultText = '';
            if (hasRange && minTotal !== maxTotal) {
                resultText = minTotal + '-' + maxTotal;
            } else {
                resultText = minTotal;
            }

            if (discountValue > 0) {
                resultText += ' (со скидкой -' + discountValue + '%)';
            }

            grandTotalSpan.textContent = resultText;
        }

        document.getElementById('discount-group').addEventListener('change', updateGrandTotal);

        // Логика отжатия кнопок скидок
        let lastCheckedRadio = null;
        document.querySelectorAll('input[name="discount-option"]').forEach(radio => {
            radio.addEventListener('click', function() {
                if (lastCheckedRadio === this) {
                    this.checked = false;
                    lastCheckedRadio = null;
                    updateGrandTotal();
                } else {
                    lastCheckedRadio = this;
                }
            });
        });

        function openLightbox(src) {
            console.log('Opening lightbox with:', src);
        }

        document.getElementById('add-block-btn').addEventListener('click', function() {
            createNewBlock();
        });

        createNewBlock();
    </script>
</body>
</html>
