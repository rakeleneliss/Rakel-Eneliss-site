<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портфолио & Конструктор</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1a1a1a; color: #fff; line-height: 1.6; overflow-x: hidden; }
        .parallax-bg {
            background-image: url('https://picsum.photos');
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 10%;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; }
        .header-text h1 { font-size: 24px; font-weight: 600; }
        .header-text p { font-size: 14px; color: #ccc; }
        .social-icons { display: flex; gap: 15px; }
        .social-icon {
            width: 40px; height: 40px; background: rgba(255,255,255,0.1);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: #fff; text-decoration: none; font-weight: bold; transition: 0.3s;
        }
        .social-icon:hover { background: #fff; color: #1a1a1a; transform: translateY(-3px); }
        .block { padding: 60px 10%; }
        .block-title {
            padding: 20px; text-align: center; font-size: 28px; letter-spacing: 2px;
            text-transform: uppercase; border-radius: 8px; margin-bottom: 30px;
            box-shadow: inset 0 0 0 2000px rgba(0, 0, 0, 0.4);
        }
        .carousel-container {
            max-width: 600px; margin: 0 auto; position: relative;
            border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .carousel-slides { display: flex; transition: transform 0.5s ease-in-out; }
        .carousel-slide { min-width: 100%; height: 400px; object-fit: cover; cursor: pointer; }
        .constructor-section { background: #222; padding: 60px 10%; text-align: center; }
        .constructor-card {
            background: #2b2b2b; max-width: 500px; margin: 0 auto; border-radius: 16px;
            overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.6); padding: 25px;
        }
        .preview-box { width: 100%; height: 250px; background: #3a3a3a; border-radius: 8px; margin-bottom: 20px; overflow: hidden; }
        .preview-box img { width: 100%; height: 100%; object-fit: cover; }
        .option-group { margin-bottom: 20px; text-align: left; }
        .option-label { font-size: 14px; color: #aaa; margin-bottom: 8px; text-transform: uppercase; display: block;}
        .buttons-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .btn-opt {
            background: #3a3a3a; border: 2px solid transparent; color: #fff; padding: 10px 5px;
            border-radius: 8px; cursor: pointer; font-size: 13px; transition: 0.2s; font-weight: 500;
        }
        .btn-opt:hover { background: #4a4a4a; }
        .btn-opt.active { background: #007bff !important; border-color: #00d2ff !important; }
        .price-display { font-size: 28px; font-weight: bold; margin-top: 25px; color: #00d2ff; border-top: 1px solid #444; padding-top: 15px; }
        .lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9);
            display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease; z-index: 1000;
        }
        .lightbox.active { opacity: 1; pointer-events: auto; }
        .lightbox-img { max-width: 90%; max-height: 90%; border-radius: 4px; transform: scale(0.95); transition: transform 0.4s ease; }
        .lightbox.active .lightbox-img { transform: scale(1); }
        
        /* Стили для калькулятора */
        @font-face {
            font-family: 'Epos Medium';
            src: local('Epos Medium'), local('Epos-Medium');
        }

        :root {
            --bg-color: #fcf2f9;
            --main-color: #723d93;
            --muted-color: #a382b9;
            --border-color: #e8d0e5;
        }

        .calculator-section {
            background-color: var(--bg-color);
            color: var(--main-color);
            padding: 40px 10%;
        }

        .container {
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
            margin: 0 auto;
        }

        h2 {
            text-align: center;
            font-weight: normal;
            margin-bottom: 25px;
            font-size: 1.5em;
        }

        .calculator-block {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
            box-shadow: 0 4px 10px rgba(114, 61, 147, 0.05);
            box-sizing: border-box;
        }

        .remove-btn {
            position: absolute;
            top: 12px;
            right: 15px;
            background: none;
            border: none;
            color: #cc4444;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .remove-btn:hover {
            color: #ff5555;
        }

        .section {
            margin-bottom: 18px;
        }

        .section-title {
            font-size: 1.05em;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 10px;
            background: var(--bg-color);
            border: 1px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9em;
            user-select: none;
        }

        .option-label:hover {
            border-color: var(--muted-color);
        }

        .option-label input {
            margin-right: 8px;
            accent-color: var(--main-color);
            cursor: pointer;
        }

        .custom-count-wrapper {
            margin-top: 10px;
            display: none;
        }

        .custom-count-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--main-color);
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
        }

        .custom-count-input:focus {
            border-color: var(--main-color);
        }

        .notice {
            font-size: 0.8em;
            color: var(--muted-color);
            margin-top: 8px;
            line-height: 1.3;
        }

        .block-total {
            text-align: right;
            font-size: 1.1em;
            margin-top: 15px;
            font-weight: bold;
            border-top: 1px dashed var(--border-color);
            padding-top: 15px;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            margin-top: 10px;
            margin-bottom: 25px;
        }

        .btn {
            background-color: transparent;
            color: var(--main-color);
            border: 2px solid var(--main-color);
            padding: 10px 25px;
            font-family: inherit;
            font-size: 1em;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background-color: var(--main-color);
            color: #ffffff;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .final-summary {
            background: var(--main-color);
            color: #ffffff;
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            font-size: 1.25em;
            box-shadow: 0 6px 15px rgba(114, 61, 147, 0.2);
            box-sizing: border-box;
        }

        .final-summary span {
            font-weight: bold;
        }
    </style>
</head>
<body class="parallax-bg">

    <header>
        <div class="header-left">
            <img class="avatar" src="https://picsum.photos" alt="Аватар">
            <div class="header-text">
                <h1>Ваше Имя / Никнейм</h1>
                <p>Digital художник & Иллюстратор</p>
            </div>
        </div>
        <div class="social-icons">
            <a href="#" class="social-icon">TG</a>
            <a href="#" class="social-icon">VK</a>
            <a href="#" class="social-icon">DA</a>
        </div>
    </header>

    <section class="block">
        <div class="block-title parallax-bg">Мои Скетчи</div>
        <div class="carousel-container" data-speed="3000">
            <div class="carousel-slides">
                <img class="carousel-slide" src="https://picsum.photos" alt="Скетч 1" onclick="openLightbox(this.src)">
                <img class="carousel-slide" src="https://picsum.photos" alt="Скетч 2" onclick="openLightbox(this.src)">
                <img class="carousel-slide" src="https://picsum.photos" alt="Скетч 3" onclick="openLightbox(this.src)">
            </div>
        </div>
    </section>

    <section class="block">
        <div class="block-title parallax-bg">Сложный рендер</div>
        <div class="carousel-container" data-speed="3000">
            <div class="carousel-slides">
                <img class="carousel-slide" src="https://picsum.photos" alt="Арт 1" onclick="openLightbox(this.src)">
                <img class="carousel-slide" src="https://picsum.photos" alt="Арт 2" onclick="openLightbox(this.src)">
                <img class="carousel-slide" src="https://picsum.photos" alt="Арт 3" onclick="openLightbox(this.src)">
            </div>
        </div>
    </section>

    <section class="calculator-section">
        <div class="container">
            <h2>Второй калькулятор</h2>
            <div id="calculator-list"></div>
            <div class="action-buttons">
                <button class="btn" id="add-block-btn">+ Добавить еще</button>
            </div>
            <div class="final-summary">
                Общая сумма: <span id="grand-total">0</span> руб.
            </div>
        </div>
    </section>

    <script>
        const priceList = {
            sketch: { head: 450, half: 900, full: 1200 },
            simple: { head: 800, half: 2000, full: 2800 },
            hard:   { head: 1300, half: 2800, full: 4200 }
        };

        const calculatorList = document.getElementById('calculator-list');
        const grandTotalSpan = document.getElementById('grand-total');
        let blockCounter = 0;

        function createNewBlock() {
            blockCounter++;
            const blockId = blockCounter;
            
            const block = document.createElement('div');
            block.className = 'calculator-block';
            block.innerHTML = `
                <button class="remove-btn" title="Удалить этот заказ" onclick="removeBlock(event)">&times;</button>
                
                <div class="section">
                    <div class="section-title">Рендер</div>
                    <div class="options-grid">
                        <label class="option-label"><input type="radio" name="render-${blockId}" value="sketch" checked> скетч/МОНО цвет</label>
                        <label class="option-label"><input type="radio" name="render-${blockId}" value="simple"> Простой рендер</label>
                        <label class="option-label"><input type="radio" name="render-${blockId}" value="hard"> Сложный рендер</label>
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">Формат</div>
                    <div class="options-grid">
                        <label class="option-label"><input type="radio" name="format-${blockId}" value="head" checked> Хед</label>
                        <label class="option-label"><input type="radio" name="format-${blockId}" value="half"> Халф</label>
                        <label class="option-label"><input type="radio" name="format-${blockId}" value="full"> Полнорост</label>
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">Персонажи</div>
                    <div class="options-grid">
                        <label class="option-label"><input type="radio" name="chars-${blockId}" value="1" checked> 1</label>
                        <label class="option-label"><input type="radio" name="chars-${blockId}" value="2"> 2 (x2 к цене)</label>
                        <label class="option-label"><input type="radio" name="chars-${blockId}" value="custom"> Свой вариант</label>
                    </div>
                    <div class="custom-count-wrapper">
                        <input type="number" class="custom-count-input" value="3" min="1" placeholder="Введите количество персонажей">
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">Способ выполнения</div>
                    <div class="options-grid">
                        <label class="option-label"><input type="radio" name="style-${blockId}" value="digital" checked> Диджитал</label>
                        <label class="option-label"><input type="radio" name="style-${blockId}" value="traditional"> Традишионал</label>
                    </div>
                    <div class="notice traditional-notice" style="display: none;">Если нужно - доставка за ваш счёт любыми службами.</div>
                </div>

                <div class="section">
                    <div class="section-title">Другие опции</div>
                    <div class="options-grid">
                        <label class="option-label"><input type="checkbox" name="chibi-${blockId}" value="chibi"> Чиби (цена / 2)</label>
                        <label class="option-label"><input type="checkbox" name="design-${blockId}" value="design"> Оформление (+200)</label>
                    </div>
                </div>

                <div class="block-total">
                    Стоимость: <span class="block-price">0</span> руб.
                </div>
            `;

            block.addEventListener('change', () => calculateBlock(block, blockId));
            
            const charsRadios = block.querySelectorAll(`input[name="chars-${blockId}"]`);
            const customWrapper = block.querySelector('.custom-count-wrapper');
            charsRadios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    customWrapper.style.display = (e.target.value === 'custom') ? 'block' : 'none';
                    calculateBlock(block, blockId);
                });
            });

            const styleRadios = block.querySelectorAll(`input[name="style-${blockId}"]`);
            const traditionalNotice = block.querySelector('.traditional-notice');
            styleRadios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    traditionalNotice.style.display = (e.target.value === 'traditional') ? 'block' : 'none';
                    calculateBlock(block, blockId);
                });
            });

            calculatorList.appendChild(block);
            calculateBlock(block, blockId);
        }

        function removeBlock(event) {
            event.preventDefault();
            event.currentTarget.closest('.calculator-block').remove();
            updateGrandTotal();
        }

        function calculateBlock(block, blockId) {
            const renderType = block.querySelector(`input[name="render-${blockId}"]:checked`).value;
            const format = block.querySelector(`input[name="format-${blockId}"]:checked`).value;
            const chars = block.querySelector(`input[name="chars-${blockId}"]:checked`).value;
            const chibi = block.querySelector(`input[name="chibi-${blockId}"]`).checked;
            const design = block.querySelector(`input[name="design-${blockId}"]`).checked;

            let price = priceList[renderType][format];

            if (chars === '2') {
                price *= 2;
            } else if (chars === 'custom') {
                const customCount = block.querySelector('.custom-count-input').value || 1;
                price *= parseInt(customCount);
            }

            if (chibi) {
                price /= 2;
            }

            if (design) {
                price += 200;
            }

            block.querySelector('.block-price').textContent = price;
            updateGrandTotal();
        }

        function updateGrandTotal() {
            let total = 0;
            document.querySelectorAll('.block-price').forEach(el => {
                total += parseInt(el.textContent) || 0;
            });
            grandTotalSpan.textContent = total;
        }

        function openLightbox(src) {
            console.log('Opening lightbox with:', src);
        }

        document.getElementById('add-block-btn').addEventListener('click', function() {
            createNewBlock();
        });

        createNewBlock();
    </script>
</body>
</html>
